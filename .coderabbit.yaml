# CodeRabbit 리뷰 설정 — https://docs.coderabbit.ai/reference/configuration
# 이 파일이 저장소에 있으면 CodeRabbit(GitHub App)이 PR을 리뷰할 때 이 규칙을 따릅니다.
language: ko-KR
early_access: false
enable_free_tier: true            # 공개 저장소 무료 플랜 기능 사용

reviews:
  # chill = 핵심 위주로 부드럽게, assertive = 더 깐깐하게.
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: false            # PR마다 "리뷰 상태" 코멘트를 남기지 않아 노이즈 감소
  auto_review:
    enabled: true
    # 푸시마다 리뷰가 도는 건 무료 플랜 할당량을 빠르게 태운다. PR #10에서 실제로
    # 한도에 걸려 리뷰가 한 시간 가까이 멈췄다. 첫 리뷰만 자동으로 받고, 지적을
    # 고친 뒤에는 `@coderabbitai review`로 직접 트리거한다.
    auto_incremental_review: false
    # Draft 동안엔 리뷰하지 않는다. Ready로 표시할 때 첫 리뷰가 시작된다.
    drafts: false
    base_branches:
      - main
      # stacked PR은 base가 feature 브랜치라 main만 걸어두면 자동 리뷰에서 빠진다.
      - "feature/.*"
  # 리뷰할 필요 없는 산출물/자동생성물 제외
  path_filters:
    - "!**/build/**"
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!**/*.lock"
    - "!**/gradlew*"
    - "!**/gradle/wrapper/**"
  # 이 프로젝트의 아키텍처 규칙을 리뷰어에게 각인 (경로별 지침)
  path_instructions:
    - path: "backend/domain/**/*.java"
      instructions: >
        domain 모듈은 순수 Java여야 한다. Spring, JGit, SVNKit 등 프레임워크/엔진 타입에
        의존하면 지적하라. 모델은 불변(record) 우선.
    - path: "backend/application/**/*.java"
      instructions: >
        application 모듈도 순수 Java여야 한다. Spring 애너테이션/타입(@Service, @Component,
        @Autowired 등), JGit/SVNKit, slf4j에 의존하면 지적하라. 의존성은 생성자 주입으로만
        받고, 객체 배선은 bootstrap의 Composition Root(config 패키지)에서만 한다. 로깅이
        필요하면 JDK의 System.Logger를 쓴다. 유스케이스는 도메인 포트에만 의존해야 하며,
        클라이언트가 보낸 값(경로, ref, 페이지 크기)은 포트를 열기 전에 검증하라.
    - path: "backend/infrastructure/**/*.java"
      instructions: >
        인프라 어댑터는 엔진(JGit/SVNKit) 예외를 경계에서 반드시 번역해야 한다. 엔진 예외가
        그대로 밖으로 새면 지적하라. 행선지는 원인에 따라 넷으로 갈린다.
        (1) 엔진/IO 자체의 실패 → 도메인 VcsException 계층 (500).
        (2) 호출자가 보낸 값이 잘못됨 → IllegalArgumentException (400).
        (3) 대상이 존재하지 않음 → NoSuchElementException (404).
        (4) 그 VCS가 지원하지 않는 동작 → UnsupportedOperationException
        (CAPABILITY_NOT_SUPPORTED). (4)는 입력 오류가 아니라 provider의 capability 문제이므로
        (2)와 구분해서 다뤄야 한다. (2)~(4)를 VcsException으로 감싸면 사용자 실수나 미지원
        기능이 500으로 보고되므로 오히려 잘못이다.
        자원(Git/Repository 등 AutoCloseable)은 try-with-resources로 닫는지 확인하라.
    - path: "backend/bootstrap/**/*.java"
      instructions: >
        Spring이 허용되는 유일한 모듈이다. 배선은 config 패키지의 @Bean에서 명시적인 new로
        하고, 도메인/애플리케이션 타입에 컴포넌트 스캔용 애너테이션을 붙이지 마라.
        컨트롤러는 얇아야 한다. 예외를 직접 HTTP 상태로 번역하지 말고 ApiExceptionHandler에
        맡기고, 요청/응답 DTO는 record로 두고 도메인 모델을 그대로 노출하지 마라.
        OperationEvents 구현과 SSE 어댑터는 워커 스레드에서 호출되므로 thread-safe해야 하고
        예외를 밖으로 던지면 안 된다(끊긴 클라이언트가 작업을 실패시키면 안 된다).
        백그라운드 스레드를 만들면 데몬으로 만들고 종료 경로(close/@PreDestroy)를 확인하라.
    - path: "frontend/src/**/*.{ts,tsx}"
      instructions: >
        Feature-Sliced 구조를 따르는지, 사용자 노출 문자열이 i18n을 거치는지 확인하라.
        서버 상태는 TanStack Query로 다루고 쿼리 키는 shared/api/queryKeys.ts 팩토리를
        거쳐야 한다. 백그라운드 refetch가 사용자가 입력 중인 폼 상태를 덮어쓰지 않는지,
        로딩/에러 상태를 처리하는지 확인하라.

chat:
  auto_reply: true
