# Local-only binding: the backend is a private companion process of the desktop app.
server.address=127.0.0.1
# Default development port; production passes --server.port=<random free port>.
server.port=8420

spring.application.name=configflow-backend
spring.main.banner-mode=off

# Session token; production passes --configflow.token=<random>. Dev fallback:
configflow.token=dev-token

# SQLite file location; empty means %USERPROFILE%\.configflow\configflow.db
configflow.db.path=
